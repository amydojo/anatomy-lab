name: STRATA independent lab gate
on:
  pull_request:
    branches: ['feat/v15-expedition-gamepad']
    paths: ['assets/atlas/strata/**','atlas/strata/**','tests/v16-strata.test.mjs','.github/workflows/v16-strata.yml']
permissions:
  contents: read
jobs:
  strata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/atlas/strata/lab.mjs
      - run: node --test tests/v16-strata.test.mjs
      - run: node --test tests/v15-expedition.test.mjs tests/v15-world-engine.test.mjs tests/v15-axis.test.mjs
