name: NEXUS paired-origin creative qualification
on:
  pull_request:
    branches: ['feat/v15-expedition-gamepad']
permissions:
  contents: read
jobs:
  paired:
    if: github.head_ref == 'feat/nexus-experience'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1307531683256682e517e19eceece620aac99b45
          path: .nexus-companion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright test tests/nexus-paired.spec.mjs --project=desktop-chromium
      - run: npx playwright test tests/nexus-essence-creative.spec.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-paired-evidence
          path: |
            test-results/
            artifacts/results.json
          if-no-files-found: warn
