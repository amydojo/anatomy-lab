name: V8.3 mobile workbench QA
on:
  push:
    branches: [feat/v8-3-mobile-workbench]
  pull_request:
    branches: [feat/v8-2-regional-kinematics]
permissions:
  contents: read
concurrency:
  group: v8-3-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify source geometry and motion invariants
        run: npm test
      - run: npx playwright install chromium webkit
      - name: Exercise mobile workbench and prior atlas geometry
        run: npx playwright test tests/v83-mobile.spec.mjs tests/v8-motion.spec.mjs tests/v8-atlas.spec.mjs tests/v7-atlas.spec.mjs --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-v8-3-diagnostics
          path: test-results/
          if-no-files-found: ignore
  regression:
    needs: mobile
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium webkit
      - name: Full application browser regression
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-app-mobile-regression-diagnostics
          path: test-results/
          if-no-files-found: ignore
