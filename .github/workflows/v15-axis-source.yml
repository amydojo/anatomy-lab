name: AXIS pinned source qualification
on:
  push:
    branches: ['feat/v15-expedition-gamepad']
    paths: ['scripts/acquire_axis.py', '.github/workflows/v15-axis-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axis-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.ref == 'refs/heads/feat/v15-expedition-gamepad'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/acquire_axis.py --self-test
      - run: python3 scripts/acquire_axis.py --output axis-qualified
      - uses: actions/upload-artifact@v4
        with:
          name: axis-pinned-source-qualified
          path: axis-qualified/
          retention-days: 7
          if-no-files-found: error
