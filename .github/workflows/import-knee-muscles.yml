name: Import pinned right knee muscles
on:
  push:
    branches: [feat/v6-9-hip-knee-muscle-motion]
    paths:
      - scripts/import_bp3d_knee_muscles.py
      - .github/workflows/import-knee-muscles.yml
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned source and audit the imported muscle meshes
        run: python3 scripts/import_bp3d_knee_muscles.py
      - name: Persist model and verifiable source provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knee/spatial/assets/knee-muscles-source.json knee/spatial/assets/knee-muscles-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Import pinned right knee muscle geometry and provenance"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
