name: HAIRPIN COUTURE METAMORPHOSIS
on:
  pull_request:
    branches: ['experiment/marrow-hairpin-001']
    paths:
      - 'experiments/hairpin/couture/metamorphosis.py'
      - 'experiments/hairpin/couture/persistent_motion.py'
      - '.github/workflows/hairpin-metamorphosis.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: metamorphosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.head_ref == 'experiment/hairpin-couture-001' || github.ref_name == 'experiment/hairpin-couture-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: couture-native-masters
          run-id: 45965588779
          github-token: ${{ github.token }}
          path: historical
      - name: Preserve all historical native masters
        run: sha256sum -c historical/SHA256SUMS || (cd historical && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: metamorphosis-historical-masters
          path: historical/
          if-no-files-found: error
      - run: sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y blender
      - run: python3 -m py_compile experiments/hairpin/couture/*.py
      - name: Generate new closed and open masters
        run: |
          mkdir -p native
          blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/metamorphosis.py -- --mode build --out native 2>&1 | tee native/build.log
          sha256sum native/*.blend > native/SHA256SUMS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamorphosis-serpent-native
          path: native/
          if-no-files-found: warn
  audit:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pose: [closed, open]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: metamorphosis-serpent-native
          path: native
      - run: sha256sum -c native/SHA256SUMS
      - run: sudo apt-get update && sudo apt-get install -y blender
      - run: |
          mkdir -p audit
          blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/metamorphosis.py -- --mode audit --source native/SERPENT-002-${{ matrix.pose }}.blend --out audit 2>&1 | tee audit/reopen.log
          test -s audit/audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamorphosis-audit-${{ matrix.pose }}
          path: audit/
          if-no-files-found: warn
  fashion:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - pose: closed
            mode: render
          - pose: open
            mode: open-render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: metamorphosis-serpent-native
          path: native
      - run: sha256sum -c native/SHA256SUMS
      - run: sudo apt-get update && sudo apt-get install -y blender
      - name: Actual render preflight
        run: blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/metamorphosis.py -- --mode preflight --source native/SERPENT-002-${{ matrix.pose }}.blend --out preflight
      - name: Actual metal, clay, normal-zebra and worn reference
        run: |
          mkdir -p renders
          blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/metamorphosis.py -- --mode ${{ matrix.mode }} --source native/SERPENT-002-${{ matrix.pose }}.blend --out renders 2>&1 | tee renders/render.log
          if [ "${{ matrix.pose }}" = closed ]; then
            for f in metal-hero metal-top metal-side metal-crown mechanism-underside clay-hero clay-crown zebra-hero zebra-crown worn-back worn-profile; do test -s renders/$f.png || exit 1; done
          else
            test -s renders/open-mechanism.png
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamorphosis-fashion-${{ matrix.pose }}
          path: |
            preflight/
            renders/
          if-no-files-found: warn
  motion:
    if: github.head_ref == 'experiment/hairpin-couture-001' || github.ref_name == 'experiment/hairpin-couture-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vector-chromatic-candidate
          run-id: 45946040601
          github-token: ${{ github.token }}
          path: source
      - run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - name: Unchanged protected mechanical gate
        run: blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/vector/continuity/qualify_continuity.py -- --master source/VECTOR-005-AFTERBURN-0042-master.blend --out mechanical.json
      - name: Two actual endpoint preflight renders
        run: blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/persistent_motion.py -- --source source/VECTOR-005-AFTERBURN-0042-master.blend --out preflight --preflight
      - name: Persistent native component film
        run: |
          mkdir -p frames
          blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/persistent_motion.py -- --source source/VECTOR-005-AFTERBURN-0042-master.blend --out frames 2>&1 | tee frames/motion.log
          test -s frames/evidence.json
      - name: Encode both directions and original mechanical sound
        run: |
          python3 experiments/hairpin/couture/sound.py ritual.wav
          ffmpeg -v error -framerate 8 -i frames/frame-%04d.png -i ritual.wav -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart deployment.mp4
          ffmpeg -v error -i deployment.mp4 -vf reverse -af areverse -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a aac -movflags +faststart stow.mp4
          ffprobe -v error -show_streams -show_format -of json deployment.mp4 > video-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamorphosis-persistent-motion
          path: |
            preflight/
            frames/
            deployment.mp4
            stow.mp4
            ritual.wav
            mechanical.json
            video-report.json
          if-no-files-found: warn
