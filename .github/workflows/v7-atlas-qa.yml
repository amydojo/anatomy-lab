name: Whole-body atlas quality
on:
  push:
    branches: [feat/v7-0-whole-body-atlas]
  pull_request:
    branches: [feat/v6-9-hip-knee-muscle-motion]
permissions:
  contents: read
jobs:
  whole_body:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Source/provenance/kinematics contract
        run: npm test
      - run: npx playwright install chromium webkit
      - name: Test six detail regions on mobile Safari, Chromium and desktop
        run: npx playwright test tests/v7-atlas.spec.mjs --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-source-anatomy-screens
          path: artifacts/v7-*.png
          if-no-files-found: warn
