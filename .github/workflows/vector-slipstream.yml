name: VECTOR SLIPSTREAM continuous contact research
on:
  pull_request:
    branches: ['experiment/marrow-hairpin-001']
    paths:
      - 'experiments/hairpin/vector/velocity/slipstream-*.mjs'
      - 'experiments/hairpin/vector/velocity/flow-lab.mjs'
      - 'assets/atlas/marrow-surface.js'
      - 'assets/atlas/marrow.js'
      - 'play/index.html'
      - 'tests/slipstream*'
      - '.github/workflows/vector-slipstream.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laboratory:
    if: github.head_ref == 'experiment/vector-velocity-006' || github.ref_name == 'experiment/vector-velocity-006'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/atlas/marrow-surface.js && node --check experiments/hairpin/vector/velocity/slipstream-manifold.mjs
      - run: node --test tests/marrow-board.test.mjs tests/marrow-gyro.test.mjs tests/marrow-ride.test.mjs tests/marrow-surface.test.mjs tests/afterglow-camera.test.mjs tests/euphoria-input.test.mjs tests/osteodynamics.test.mjs tests/flow-state.test.mjs tests/slipstream.test.mjs
      - if: ${{ !cancelled() }}
        run: node experiments/hairpin/vector/velocity/slipstream-lab-runner.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-slipstream-laboratory
          path: slipstream-results/
          if-no-files-found: warn
  browser-review:
    if: github.head_ref == 'experiment/vector-velocity-006' || github.ref_name == 'experiment/vector-velocity-006'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, webkit-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: echo 'e64ef983520090af7b07b2e3f67e6fc365a615b17d5ba457faf2039f3920fb66  experiments/hairpin/vector/velocity/generated/VECTOR-005-VELOCITY-20000.glb' | sha256sum -c -
      - run: npm install --no-audit --no-fund
      - run: npx playwright test tests/slipstream.spec.mjs --project=${{ matrix.project }} --workers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-slipstream-review-${{ matrix.project }}
          path: test-results/
          if-no-files-found: warn
