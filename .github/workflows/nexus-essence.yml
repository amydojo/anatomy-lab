name: ESSENCE interface qualification
on:
  pull_request:
    branches: ['feat/v15-expedition-gamepad']
permissions:
  contents: read
jobs:
  essence:
    if: github.head_ref == 'feat/nexus-experience'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx playwright test tests/nexus.spec.mjs tests/nexus-essence.spec.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essence-interface-evidence
          path: |
            test-results/
            artifacts/results.json
          if-no-files-found: warn
