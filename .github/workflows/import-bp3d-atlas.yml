name: Import pinned V6 BodyParts3D skeleton LOD
on:
  push:
    branches: ['feat/v6-atlas-portal']
    paths:
      - 'scripts/import_bp3d_atlas.py'
      - '.github/workflows/import-bp3d-atlas.yml'
permissions:
  contents: write
concurrency:
  group: atlas-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy fast-simplification
      - name: Import hash-verified source and simplify without altering reference coordinates
        run: python3 scripts/import_bp3d_atlas.py
      - name: Validate attribution, coverage and geometry
        run: |
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          r=Path('atlas/assets')
          d=json.loads((r/'body-skeleton.json').read_text())
          p=json.loads((r/'provenance.json').read_text())
          assert d['schema']=='body-live/atlas-skeleton-v1'
          assert len(d['parts'])>=70 and p['part_count']==len(d['parts'])
          assert p['anatomist_reviewed'] is False and d['license']=='CC BY 4.0'
          assert p['lod_triangle_count']>=10000
          assert all(len(m['vertices'])>=35 and len(m['faces'])>=70 for m in d['parts'])
          assert all(math.isfinite(v) for m in d['parts'] for q in m['vertices'] for v in q)
          print('Pinned V6 skeleton verified:',len(d['parts']),'meshes')
          PY
      - name: Commit isolated CC BY 4.0 LOD assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/assets/body-skeleton.json atlas/assets/provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Import source-pinned full-body skeletal context meshes [skip ci]"
            git push origin HEAD:feat/v6-atlas-portal
          fi
