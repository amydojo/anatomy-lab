name: Generate V10 registered facial source geometry
on:
  push:
    branches: [feat/v10-facial-source-registration]
    paths:
      - scripts/import_v10_facial.py
      - .github/workflows/v10-facial-source.yml
permissions:
  contents: write
concurrency:
  group: v10-registered-facial-geometry
  cancel-in-progress: false
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin mesh-reduction dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 fast-simplification==0.1.12
      - name: Fetch verified OMFAtlas facial binary and register to BODY LIVE frame
        run: python scripts/import_v10_facial.py
      - name: Commit verified source JSON and CC BY-SA provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/assets/v10-facial-reference.json atlas/assets/v10-facial-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate 47 pinned CC BY-SA 2.1 Japan facial muscle reference meshes"
            git fetch origin "refs/heads/${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
