name: MORPHOLOGY source acquisition
on:
  push:
    branches: ['feat/unity-strata']
    paths: ['scripts/acquire_morphology.py','assets/atlas/morphology/source-lock.json','.github/workflows/morphology-acquire.yml']
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python3 scripts/acquire_morphology.py | tee morphology-acquisition.json
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: morphology-qualified-source
          path: |
            assets/atlas/morphology/acquired/
            morphology-acquisition.json
      - name: Publish only to unchanged isolated STRATA branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/feat/unity-strata
          git fetch origin feat/unity-strata
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atlas/morphology/acquired/
          git diff --cached --quiet && exit 0
          git commit -m "MORPHOLOGY: publish verified indexed upper-body source packs"
          git push origin HEAD:refs/heads/feat/unity-strata
