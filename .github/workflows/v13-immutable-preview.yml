name: V13 immutable preview validation
on:
  push:
    branches: ['qa/v13-preview-validation']
permissions:
  contents: read
concurrency:
  group: v13-immutable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium-mobile, webkit-mobile, desktop-chromium]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 60
    env:
      BASE_URL: https://anatomy-5pbw3dr8d-amy-dos-projects.vercel.app
      EXPECTED_SHA: 5eff54053ffce0738eca4044e51f699a83d9fd76
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eff54053ffce0738eca4044e51f699a83d9fd76
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python3 -m unittest discover -s scripts/tests
      - name: Verify immutable preview files against exact checked out commit
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          for (const path of ['atlas/index.html','hip/spatial/index.html','hip/spatial/sources/index.html','hip/dissection/index.html','atlas/desktop-studio.css','assets/spatial-core.js','assets/atlas/atlas-unified.js','assets/atlas/atlas-mobile-workbench.js','assets/atlas/atlas-desktop-studio.js','assets/atlas/v13-anatomy-info.js','assets/atlas/atlas-v11-source.js']) {
            const response=await fetch(process.env.BASE_URL+'/'+path);
            if(!response.ok) throw Error(path+': HTTP '+response.status);
            const deployed=Buffer.from(await response.arrayBuffer());
            const application=deployed;
            if(!application.equals(readFileSync(path)))throw Error('Preview content does not match '+process.env.EXPECTED_SHA+': '+path);
            console.log(path,createHash('sha256').update(application).digest('hex'));
          }
          JS
      - name: Complete hosted regression against the immutable RC
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-immutable-preview-${{ matrix.browser }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
