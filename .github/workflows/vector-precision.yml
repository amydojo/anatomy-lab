name: VECTOR PRECISION front refinement
on:
  pull_request:
    branches: ['experiment/marrow-001']
    paths:
      - 'experiments/hairpin/vector/precision/**'
      - '.github/workflows/vector-precision.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  master:
    if: github.head_ref == 'experiment/marrow-hairpin-001' || github.ref_name == 'experiment/marrow-hairpin-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vector-tension-front-master
          run-id: 45922781009
          github-token: ${{ github.token }}
          path: baseline
      - run: sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y blender python3-numpy
      - run: blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/vector/precision/refine_precision.py -- --source baseline/VECTOR-005-TENSION-front.blend --out precision-output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-precision-master
          path: precision-output/
          if-no-files-found: warn
  geometry:
    needs: master
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vector-precision-master
          path: precision-output
      - run: sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y blender python3-numpy
      - name: Unchanged TENSION mechanical acceptance gate
        run: blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/vector/tension/qualify_tension.py -- --master precision-output/VECTOR-005-PRECISION-front.blend --out precision-geometry.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-precision-geometry
          path: precision-geometry.json
          if-no-files-found: warn
  proofs:
    needs: master
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: after
            mode: clay
          - edition: after
            mode: zebra
          - edition: before
            mode: clay
          - edition: before
            mode: zebra
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vector-precision-master
          path: precision-output
      - uses: actions/download-artifact@v4
        with:
          name: vector-tension-front-master
          run-id: 45922781009
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: vector-tension-after-clay
          run-id: 45922781009
          github-token: ${{ github.token }}
          path: baseline-clay
      - run: sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y blender python3-numpy
      - name: Matched camera proof
        run: |
          asset=precision-output/VECTOR-005-PRECISION-front.blend
          details=""
          if [ "${{ matrix.edition }}" = before ]; then asset=baseline/VECTOR-005-TENSION-front.blend; details="--details-only"; fi
          blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/vector/precision/render_precision.py -- --master "$asset" --baseline baseline-clay/after-clay-report.json --edition ${{ matrix.edition }} --mode ${{ matrix.mode }} --out proof-output $details
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-precision-${{ matrix.edition }}-${{ matrix.mode }}
          path: proof-output/
          if-no-files-found: warn
