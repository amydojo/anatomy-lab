name: HAIRPIN COUTURE ANASTOMOSIS NATIVE CORRESPONDENCE
on:
  pull_request:
    branches: ['experiment/marrow-hairpin-001']
    paths:
      - 'experiments/hairpin/couture/anastomosis_refine.py'
      - 'experiments/hairpin/couture/anastomosis_native_refinement.py'
      - '.github/workflows/hairpin-anastomosis-native.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  refinement:
    if: github.head_ref == 'experiment/hairpin-couture-001' || github.ref_name == 'experiment/hairpin-couture-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: genesis-chart-qualified-endpoints
          run-id: 46048612249
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: metallurgy-frozen-B-bridge-retry
          run-id: 46051582774
          github-token: ${{ github.token }}
          path: bridge
      - uses: actions/download-artifact@v4
        with:
          name: exogenesis-native-atlas
          run-id: 46053562438
          github-token: ${{ github.token }}
          path: atlas
      - uses: actions/download-artifact@v4
        with:
          name: metallurgy-numerical-trajectories
          run-id: 46051259012
          github-token: ${{ github.token }}
          path: trajectory
      - uses: actions/download-artifact@v4
        with:
          name: vector-chromatic-candidate
          run-id: 45946040601
          github-token: ${{ github.token }}
          path: source
      - run: sudo apt-get update && sudo apt-get install -y blender python3-numpy python3-scipy python3-shapely
      - run: |
          mkdir -p proof
          OPENBLAS_NUM_THREADS=1 blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/anastomosis_native_refinement.py -- --baseline baseline --bridge bridge --atlas atlas --trajectory trajectory --source source/VECTOR-005-AFTERBURN-0042-master.blend --out proof 2>&1 | tee proof/refinement.log
          python3 -c "import json; assert json.load(open('proof/refinement.json'))['completeEndpointPass']"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anastomosis-native-correspondence
          path: proof/
          if-no-files-found: warn
