name: Build verified V8 unified specimen
on:
  push:
    branches: [feat/v8-0-unified-specimen]
    paths:
      - scripts/build_v8_overview.py
      - atlas/regions/**.json
      - .github/workflows/v8-overview-assets.yml
permissions:
  contents: write
concurrency:
  group: v8-overview-source
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible geometry packages
        run: python -m pip install --disable-pip-version-check numpy==2.3.4 fast-simplification==0.1.12
      - name: Regenerate source-aligned overview geometry and hashes
        run: python scripts/build_v8_overview.py
      - name: Commit verified generated atlas assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/assets/v8-overview-detail.json atlas/assets/v8-overview-provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate V8 overview LOD and provenance from pinned source anatomy"
            git fetch origin "refs/heads/${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
