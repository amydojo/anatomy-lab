name: VECTOR KINESIS offline configuration-space qualification
on:
  pull_request:
    branches: ['experiment/marrow-hairpin-001']
    paths:
      - 'experiments/hairpin/vector/velocity/kinesis-*.mjs'
      - 'tests/kinesis*'
      - '.github/workflows/vector-kinesis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laboratory:
    if: github.head_ref == 'experiment/vector-velocity-006' || github.ref_name == 'experiment/vector-velocity-006'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: echo 'e64ef983520090af7b07b2e3f67e6fc365a615b17d5ba457faf2039f3920fb66  experiments/hairpin/vector/velocity/generated/VECTOR-005-VELOCITY-20000.glb' | sha256sum -c -
      - run: node --check experiments/hairpin/vector/velocity/kinesis-oracle.mjs && node --check experiments/hairpin/vector/velocity/kinesis-path.mjs && node --check experiments/hairpin/vector/velocity/kinesis-lab-runner.mjs
      - run: node --test tests/marrow-board.test.mjs tests/marrow-gyro.test.mjs tests/marrow-ride.test.mjs tests/marrow-surface.test.mjs tests/afterglow-camera.test.mjs tests/euphoria-input.test.mjs tests/osteodynamics.test.mjs tests/flow-state.test.mjs tests/slipstream.test.mjs tests/kinesis.test.mjs
      - if: ${{ !cancelled() }}
        run: node --max-old-space-size=6144 experiments/hairpin/vector/velocity/kinesis-lab-runner.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-kinesis-laboratory
          path: kinesis-results/
          if-no-files-found: warn
