name: Navigation cleanup qualification
on:
  push:
    branches: ['feat/navigation-cleanup']
  pull_request:
    branches: ['feat/nexus-experience']
permissions:
  contents: read
jobs:
  navigation:
    if: github.ref == 'refs/heads/feat/navigation-cleanup' || github.head_ref == 'feat/navigation-cleanup'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/navigation-cleanup.test.mjs
      - run: npm test
      - run: npx playwright test tests/navigation-cleanup.spec.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-cleanup-evidence
          path: test-results/
          if-no-files-found: warn
