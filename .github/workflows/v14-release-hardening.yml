name: V14 release hardening full gate
on:
  push:
    branches: ['fix/v14-release-hardening']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v14-hardening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, chromium-mobile, webkit-mobile]
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/audit_v14_connective_sources.cjs
      - run: node scripts/validate_connective_coverage.cjs
      - run: node scripts/validate_v14_connective.mjs
      - run: node --test tests/v14-connective-integration.test.mjs
      - run: npm test
      - run: python3 -m unittest discover -s scripts/tests
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-release-hardening-${{ matrix.browser }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
