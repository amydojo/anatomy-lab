name: HAIRPIN Atelier qualification
on:
  pull_request:
    branches: ['experiment/marrow-001']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atelier:
    if: github.head_ref == 'experiment/marrow-hairpin-001' || github.ref_name == 'experiment/marrow-hairpin-001'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/marrow-hairpin.test.mjs
      - if: ${{ !cancelled() }}
        run: npx playwright test tests/marrow-atelier.spec.mjs --project=desktop-chromium --project=webkit-mobile --workers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hairpin-atelier-evidence
          path: test-results/
          if-no-files-found: warn
