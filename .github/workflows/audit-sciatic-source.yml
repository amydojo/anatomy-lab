name: Audit pinned sciatic source geometry
on:
  push:
    branches: ['feat/v5-4-nerve-truth']
    paths:
      - 'scripts/audit_sciatic_source.py'
      - '.github/workflows/audit-sciatic-source.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify hash + list precise nerve and registration candidates
        run: python3 scripts/audit_sciatic_source.py
