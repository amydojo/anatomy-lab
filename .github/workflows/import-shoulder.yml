name: Build sourced right shoulder (staging only)
on:
  push:
    branches: [feat/v6-6-sourced-shoulder]
    paths:
      - scripts/import_bp3d_shoulder.py
      - .github/workflows/import-shoulder.yml
permissions:
  contents: write
jobs:
  source-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate pinned anatomical assets
        run: python3 scripts/import_bp3d_shoulder.py
      - name: Commit generated source-only artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shoulder/spatial/assets/shoulder-source.json shoulder/spatial/assets/provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "Import pinned real shoulder geometry and provenance"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
