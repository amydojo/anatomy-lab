name: HAIRPIN COUTURE wearable research
on:
  pull_request:
    branches: ['experiment/marrow-hairpin-001']
    paths:
      - 'experiments/hairpin/couture/**'
      - '.github/workflows/hairpin-couture.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  candidates:
    if: github.head_ref == 'experiment/hairpin-couture-001' || github.ref_name == 'experiment/hairpin-couture-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - run: python3 -m py_compile experiments/hairpin/couture/*.py
      - run: blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/build_couture.py -- --out couture
      - name: Verify candidate outputs
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('couture')
          r=json.loads((p/'candidate-evidence.json').read_text())
          assert set(r)=={'C01','C02','C03'}
          assert len(r['C03']['clasp_samples'])==16
          for c in r:
              assert all(0<x<200 for x in r[c]['bounds_mm'])
              for f in [c+'.blend']+[c+'-'+x+'.png' for x in ('hero','top','side','reverse','detail','head-envelope')]:
                  assert (p/f).stat().st_size>1000
          PY
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hairpin-couture-candidates
          path: couture/
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hairpin-couture-candidates-FAILED
          path: couture/
          if-no-files-found: warn
  transition:
    needs: candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hairpin-couture-candidates
          path: couture
      - uses: actions/download-artifact@v4
        with:
          name: vector-chromatic-candidate
          run-id: 45946040601
          github-token: ${{ github.token }}
          path: source
      - run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - name: Unchanged mechanical gate on protected source
        run: blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/vector/continuity/qualify_continuity.py -- --master source/VECTOR-005-AFTERBURN-0042-master.blend --out mechanical.json
      - name: Fictional choreography and sampled overlap evidence
        run: blender -b -t 4 --python-exit-code 1 --python experiments/hairpin/couture/transition.py -- --source source/VECTOR-005-AFTERBURN-0042-master.blend --compact couture/C03.blend --out frames
      - name: Rendered motion and original audio
        run: |
          python3 experiments/hairpin/couture/sound.py ritual.wav
          ffmpeg -v error -framerate 8 -i frames/frame-%04d.png -i ritual.wav -c:v libx264 -crf 19 -pix_fmt yuv420p -c:a aac -shortest -movflags +faststart deployment.mp4
          ffmpeg -v error -i deployment.mp4 -vf reverse -af areverse -c:v libx264 -crf 19 -pix_fmt yuv420p -c:a aac -movflags +faststart stow.mp4
          ffprobe -v error -show_streams -show_format -of json deployment.mp4 > video-report.json
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hairpin-couture-transformation
          path: |
            deployment.mp4
            stow.mp4
            ritual.wav
            mechanical.json
            video-report.json
            frames/transition-evidence.json
            frames/frame-0000.png
            frames/frame-0048.png
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hairpin-couture-transformation-FAILED
          path: |
            mechanical.json
            frames/
          if-no-files-found: warn
