name: VECTOR FLOW STATE distributed support research
on:
  pull_request:
    branches: ['experiment/marrow-hairpin-001']
    paths:
      - 'experiments/hairpin/vector/velocity/flow-*.mjs'
      - 'assets/atlas/marrow-surface.js'
      - 'assets/atlas/marrow.js'
      - 'tests/flow-state*'
      - '.github/workflows/vector-flow-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laboratory:
    if: github.head_ref == 'experiment/vector-velocity-006' || github.ref_name == 'experiment/vector-velocity-006'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/atlas/marrow.js && node --check assets/atlas/marrow-surface.js && node --check assets/atlas/atlas-controller.js
      - run: node --test tests/marrow-board.test.mjs tests/marrow-gyro.test.mjs tests/marrow-ride.test.mjs tests/marrow-surface.test.mjs tests/afterglow-camera.test.mjs tests/euphoria-input.test.mjs tests/osteodynamics.test.mjs tests/flow-state.test.mjs
      - if: ${{ !cancelled() }}
        run: node experiments/hairpin/vector/velocity/flow-lab-runner.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-flow-state-laboratory
          path: flow-results/
          if-no-files-found: warn
